title: Scoop Loops
tagline: Run a loop, visit ice cream shops, earn your scoops.
description: >-
  A regional ice cream run challenge. Run a single continuous loop that visits
  three or five ice cream shops across Maine, eat at each one, and return to
  your start.
# Set this to your published URL. For a project site it is
# https://<user>.github.io/<repo>. Leave baseurl empty for a user/org site.
logo: "/assets/images/scoop-loops.svg"
logo_alt: "Scoop Loops"
url: "https://jasonday.github.io"
baseurl: "/scoop-loops"

# Build settings
markdown: kramdown
theme: null
plugins: []

# How many entries to show before the leaderboard scrolls
leaderboard_top: 25

# Region metadata is defined per-loop in _data/loops/loops.yaml (slug/name).

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  - vendor/
  - node_modules/
  - scripts/

sass:
  style: compressed
