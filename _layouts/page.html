---
layout: default
---
<article class="page-wrap">
  <header class="page-head">
    <img class="page-head__logo" src="{{ page.logo }}" alt="{{ page.logo_alt }}">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
