name: Process submissions

# Pulls approved rows from the Apps Script endpoint, converts photos to WebP and
# GPX tracks to simplified GeoJSON, then commits the updated data + images.
on:
  workflow_dispatch: {}
  schedule:
    # Every day at 11:00 UTC. Adjust or remove as you like.
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: process-submissions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: Process approved submissions
        working-directory: .github/scripts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          IFRAMELY_KEY: ${{ secrets.IFRAMELY_KEY }}
        run: node process.js

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/submissions.json assets/images/submissions
          if [ -f .github/scripts/embeds-cache.json ]; then
            git add .github/scripts/embeds-cache.json
          fi
          if git diff --cached --quiet; then
            echo "No submission changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add processed ice cream run submissions"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only after the processed data is safely in the repo do we mark the sheet
      # rows Processed and trash the original Drive photos/GPX.
      - name: Finalize (mark processed + remove Drive files)
        if: steps.commit.outputs.committed == 'true'
        working-directory: .github/scripts
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: node finalize.js
